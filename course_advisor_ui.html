<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Course Advisor</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 8px; }
    .user { text-align: right; margin: 6px 0; }
    .advisor { text-align: left; margin: 6px 0; white-space: pre-wrap; }
    #input-row { display: flex; gap: 8px; }
    #question { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-row">
    <input id="question" type="text" placeholder="Ask a question..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>
  <script src="/static/course_advisor_ui.js"></script>
</body>
</html>
